name: Motor de Shorts
on:
  workflow_dispatch:
    inputs:
      semana:
        description: Pasta semanal em roteiros (AAAA-MM-DD)
        required: true
        default: '2026-11-09'
  push:
    branches: [main]
    paths:
      - 'roteiros/2026-11-09/**'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEMANA: ${{ inputs.semana || '2026-11-09' }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar narração e vídeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1 espeak-ng
          pip install kokoro-onnx soundfile pillow numpy
          mkdir -p .modelos/kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl --fail --location --retry 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f" -o ".modelos/kokoro/$f"
          done
      - name: Renderizar a semana
        run: |
          [[ "$SEMANA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          compgen -G "roteiros/$SEMANA/*.json" >/dev/null
          python motor/gerar.py "roteiros/$SEMANA/*.json" saida/
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ env.SEMANA }}
          path: |
            saida/*/*.mp4
            saida/*/04_legendas/*.srt
            saida/*/SEO.txt
          if-no-files-found: error
